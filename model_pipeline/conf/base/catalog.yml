## RAW TABLES

raw_food_delivery:
  type: pandas.CSVDataset
  filepath: data/01_raw/Food_Delivery_Times.csv

## INTERMEDIATE TABLES

int_food_delivery:
  type: pandas.CSVDataset
  filepath: data/02_int/int_Food_Delivery_Times.csv

## PRIMARY TABLES

pri_train_food_delivery:
  type: pandas.CSVDataset
  filepath: data/03_pri/pri_train_food_delivery.csv

pri_test_food_delivery:
  type: pandas.CSVDataset
  filepath: data/03_pri/pri_test_food_delivery.csv

## FEATURE TABLES

fea_train_tgt:
  type: pandas.CSVDataset
  filepath: data/04_feature/fea_train_tgt.csv

fea_test_tgt:
  type: pandas.CSVDataset
  filepath: data/04_feature/fea_test_tgt.csv

## MODEL INPUT

# Stored as Parquet (not CSV) so the "category" dtype set in build_native_model_input
# survives the catalog round-trip -- CSV would flatten it back to plain strings,
# which breaks XGBoost's enable_categorical=True at fit/predict time.
modin_train_native_categorical:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/modin_train_native_categorical.parquet

modin_test_native_categorical:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/modin_test_native_categorical.parquet

modin_train_encoded_categorical:
  type: pandas.CSVDataset
  filepath: data/05_model_input/modin_train_encoded_categorical.csv

modin_test_encoded_categorical:
  type: pandas.CSVDataset
  filepath: data/05_model_input/modin_test_encoded_categorical.csv


## MODELS

model_linear_regression:
  type: pickle.PickleDataset
  filepath: data/06_models/model_linear_regression.pickle

model_lasso_regression:
  type: pickle.PickleDataset
  filepath: data/06_models/model_lasso_regression.pickle

model_random_forest:
