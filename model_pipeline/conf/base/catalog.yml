  filepath: data/06_models/model_random_forest.pickle

model_xgboost:
  type: pickle.PickleDataset
  filepath: data/06_models/model_xgboost.pickle

model_catboost:
  type: pickle.PickleDataset
  filepath: data/06_models/model_catboost.pickle

